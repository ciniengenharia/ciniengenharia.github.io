  <!-- Cliques de contato: WhatsApp, telefone e e-mail -->
  <script>
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      var h = a.getAttribute('href'), tipo = null;
      if (/wa\.me|whatsapp\.com/.test(h)) tipo = 'whatsapp';
      else if (/^tel:/.test(h)) tipo = 'telefone';
      else if (/^mailto:/.test(h)) tipo = 'email';
      if (tipo) window.dataLayer.push({event: 'clique_contato', tipo_contato: tipo, link_url: h});
    });
  </script>

<!-- MENU -->
<div id="menu"></div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  fetch("/menu.html")
    .then(response => {
      if (!response.ok) {
        throw new Error("Erro ao carregar menu.html");
      }
      return response.text();
    })
    .then(data => {
      document.getElementById("menu").innerHTML = data;

      const toggle = document.querySelector(".menu-toggle");
      const links = document.querySelector(".menu-links");
      if (toggle && links) {
        toggle.addEventListener("click", function() {
          links.classList.toggle("open");
          toggle.classList.toggle("open");
        });
      }
    })
    .catch(error => {
      console.error("Erro no menu:", error);
    });
});
</script>
